name: configure-image-provider

on:
  workflow_dispatch:
    inputs:
      image_provider:
        description: "Image provider preset"
        required: true
        default: "ark"
        type: choice
        options:
          - ark
          - qwen
          - custom
      image_model:
        description: "Custom image model override"
        required: false
        default: ""
        type: string
      image_base_url:
        description: "Custom OpenAI-compatible image API base URL override"
        required: false
        default: ""
        type: string
      image_api_key_env:
        description: "Custom env var name that contains the image API key"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve image provider config
        id: image_config
        shell: bash
        run: |
          set -euo pipefail
          provider="${{ inputs.image_provider }}"
          model="${{ inputs.image_model }}"
          base_url="${{ inputs.image_base_url }}"
          api_key_env="${{ inputs.image_api_key_env }}"

          case "$provider" in
            qwen)
              model="${model:-qwen-image-2.0}"
              base_url="${base_url:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
              api_key_env="${api_key_env:-DASHSCOPE_API_KEY}"
              ;;
            ark)
              model="${model:-doubao-seedream-4-5-251128}"
              base_url="${base_url:-https://ark.cn-beijing.volces.com/api/v3}"
              api_key_env="${api_key_env:-ARK_API_KEY}"
              ;;
            custom)
              if [ -z "$model" ] || [ -z "$base_url" ] || [ -z "$api_key_env" ]; then
                echo "custom provider requires image_model, image_base_url, and image_api_key_env."
                exit 1
              fi
              ;;
            *)
              echo "Unsupported image_provider: $provider"
              exit 1
              ;;
          esac

          {
            echo "model=$model"
            echo "base_url=$base_url"
            echo "api_key_env=$api_key_env"
          } >> "$GITHUB_OUTPUT"

      - name: Write image provider config to remote .env
        uses: appleboy/ssh-action@v1.0.3
        env:
          WEBGAL_IMAGE_MODEL: ${{ steps.image_config.outputs.model }}
          WEBGAL_IMAGE_BASE_URL: ${{ steps.image_config.outputs.base_url }}
          WEBGAL_IMAGE_API_KEY_ENV: ${{ steps.image_config.outputs.api_key_env }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: WEBGAL_IMAGE_MODEL,WEBGAL_IMAGE_BASE_URL,WEBGAL_IMAGE_API_KEY_ENV
          command_timeout: 10m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            touch .env
            tmp="$(mktemp)"
            grep -v -E '^(WEBGAL_IMAGE_MODEL|WEBGAL_IMAGE_BASE_URL|WEBGAL_IMAGE_API_KEY_ENV)=' .env > "$tmp" || true
            {
              cat "$tmp"
              printf '%s\n' "WEBGAL_IMAGE_MODEL=$WEBGAL_IMAGE_MODEL"
              printf '%s\n' "WEBGAL_IMAGE_BASE_URL=$WEBGAL_IMAGE_BASE_URL"
              printf '%s\n' "WEBGAL_IMAGE_API_KEY_ENV=$WEBGAL_IMAGE_API_KEY_ENV"
            } > .env
            rm -f "$tmp"
            echo "Updated image provider config:"
            grep -E '^(WEBGAL_IMAGE_MODEL|WEBGAL_IMAGE_BASE_URL|WEBGAL_IMAGE_API_KEY_ENV)=' .env
