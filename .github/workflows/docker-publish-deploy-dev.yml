name: docker-publish-deploy-development

on:
  push:
    branches:
      - "feature/**"
      - "feature-*"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Build, push, and deploy to the Non-Prod Docker host"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: crpi-tuqzw1uka36vt7nh.cn-hangzhou.personal.cr.aliyuncs.com
  BACKEND_IMAGE_NAME: acr_namespace_narrativeos/narrativeos-engine-backend
  FRONTEND_IMAGE_NAME: acr_namespace_narrativeos/narrativeos-engine-frontend

concurrency:
  group: engine-skeleton-development
  cancel-in-progress: true

jobs:
  detect-changes:
    if: ${{ startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/feature-') }}
    environment: development
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.selection.outputs.backend }}
      frontend: ${{ steps.selection.outputs.frontend }}
      version_tag: ${{ steps.selection.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed application paths
        id: paths
        if: ${{ github.event_name == 'push' }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'webgal_backend/**'
              - 'asset_scripts/**'
              - 'src/**'
              - 'public/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'vite.config.ts'
              - 'index.html'
              - 'requirements.txt'
              - 'docker/backend.Dockerfile'
              - '.dockerignore'
              - 'docker-compose.dev.yml'
              - '.github/workflows/docker-publish-deploy-dev.yml'
            frontend:
              - 'forge_frontend_next/**'
              - 'docker/frontend.Dockerfile'
              - '.dockerignore'
              - 'docker-compose.dev.yml'
              - '.github/workflows/docker-publish-deploy-dev.yml'

      - name: Select services
        id: selection
        shell: bash
        env:
          BACKEND_CHANGED: ${{ steps.paths.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.paths.outputs.frontend }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${BACKEND_CHANGED:-false}" >> "$GITHUB_OUTPUT"
            echo "frontend=${FRONTEND_CHANGED:-false}" >> "$GITHUB_OUTPUT"
          fi
          echo "version_tag=dev-sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  build-backend:
    environment: development
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push development backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/backend.Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ needs.detect-changes.outputs.version_tag }}
          cache-from: type=gha,scope=engine-skeleton-development-backend
          cache-to: type=gha,mode=max,scope=engine-skeleton-development-backend

  build-frontend:
    environment: development
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push development frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/frontend.Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            FORGE_BACKEND_URL=http://backend:8010
            NEXT_PUBLIC_BASE_PATH=/narrativeos
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.detect-changes.outputs.version_tag }}
          cache-from: type=gha,scope=engine-skeleton-development-frontend
          cache-to: type=gha,mode=max,scope=engine-skeleton-development-frontend

  deploy:
    if: >-
      ${{
        always() &&
        (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/feature-')) &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) &&
        (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true') &&
        (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
        (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
      }}
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 240
    needs:
      - detect-changes
      - build-backend
      - build-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare development deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            sudo install -d -o "$(id -un)" -g "$(id -gn)" "${{ secrets.DEPLOY_PATH }}"
      - name: Upload development deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.dev.yml"
          target: ${{ secrets.DEPLOY_PATH }}
      - name: Deploy on Non-Prod host
        uses: appleboy/ssh-action@v1.0.3
        env:
          VERSION_TAG: ${{ needs.detect-changes.outputs.version_tag }}
          DEPLOY_BACKEND: ${{ needs.detect-changes.outputs.backend }}
          DEPLOY_FRONTEND: ${{ needs.detect-changes.outputs.frontend }}
          REGISTRY: ${{ env.REGISTRY }}
          BACKEND_IMAGE_NAME: ${{ env.BACKEND_IMAGE_NAME }}
          FRONTEND_IMAGE_NAME: ${{ env.FRONTEND_IMAGE_NAME }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: VERSION_TAG,DEPLOY_BACKEND,DEPLOY_FRONTEND,REGISTRY,BACKEND_IMAGE_NAME,FRONTEND_IMAGE_NAME,ACR_USERNAME,ACR_PASSWORD
          command_timeout: 240m
          script: |
            set -e
            mkdir -p "${{ secrets.DEPLOY_PATH }}/deploy/sound-effects"
            cd "${{ secrets.DEPLOY_PATH }}"
            test -s .env || { echo "Missing development .env in $PWD"; exit 1; }
            echo "$ACR_PASSWORD" | docker login "$REGISTRY" -u "$ACR_USERNAME" --password-stdin
            IMAGE_STATE_FILE=".deploy-images.env"
            touch "$IMAGE_STATE_FILE"
            update_image_state() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" "$IMAGE_STATE_FILE"; then
                sed -i "s|^${key}=.*|${key}=${value}|" "$IMAGE_STATE_FILE"
              else
                printf '%s=%s\n' "$key" "$value" >> "$IMAGE_STATE_FILE"
              fi
            }
            if [ "$DEPLOY_BACKEND" = "true" ]; then
              update_image_state BACKEND_IMAGE "$REGISTRY/$BACKEND_IMAGE_NAME:$VERSION_TAG"
            fi
            if [ "$DEPLOY_FRONTEND" = "true" ]; then
              update_image_state FRONTEND_IMAGE "$REGISTRY/$FRONTEND_IMAGE_NAME:$VERSION_TAG"
            fi
            if ! grep -q '^BACKEND_IMAGE=' "$IMAGE_STATE_FILE" || ! grep -q '^FRONTEND_IMAGE=' "$IMAGE_STATE_FILE"; then
              echo "Both image entries must exist in $IMAGE_STATE_FILE. Run a full deployment once to initialize it."
              exit 1
            fi
            set -a
            . "./$IMAGE_STATE_FILE"
            set +a
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Neither 'docker compose' nor 'docker-compose' is installed on the remote host."
              exit 1
            fi
            docker network inspect narrativeos-development >/dev/null 2>&1 || docker network create narrativeos-development
            SERVICES=""
            if [ "$DEPLOY_BACKEND" = "true" ]; then
              $COMPOSE_CMD --env-file .env -f docker-compose.dev.yml pull backend
              SERVICES="$SERVICES backend"
            fi
            if [ "$DEPLOY_FRONTEND" = "true" ]; then
              $COMPOSE_CMD --env-file .env -f docker-compose.dev.yml pull frontend
              SERVICES="$SERVICES frontend"
            fi
            $COMPOSE_CMD --env-file .env -f docker-compose.dev.yml up -d --no-deps $SERVICES
