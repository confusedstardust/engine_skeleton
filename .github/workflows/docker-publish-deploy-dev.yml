name: docker-publish-deploy-development

on:
  push:
    branches:
      - "feature/**"
      - "feature-*"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Build, push, and deploy to the Non-Prod Docker host"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: crpi-tuqzw1uka36vt7nh.cn-hangzhou.personal.cr.aliyuncs.com
  BACKEND_IMAGE_NAME: acr_namespace_narrativeos/narrativeos-engine-backend
  FRONTEND_IMAGE_NAME: acr_namespace_narrativeos/narrativeos-engine-frontend

concurrency:
  group: engine-skeleton-development
  cancel-in-progress: true

jobs:
  detect-changes:
    if: ${{ startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/feature-') }}
    environment: development
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.selection.outputs.backend }}
      frontend: ${{ steps.selection.outputs.frontend }}
      nar_agent: ${{ steps.selection.outputs.nar_agent }}
      version_tag: ${{ steps.selection.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed application paths
        id: paths
        if: ${{ github.event_name == 'push' }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'webgal_backend/**'
              - 'asset_scripts/**'
              - 'src/**'
              - 'public/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'vite.config.ts'
              - 'index.html'
              - 'requirements.txt'
              - 'docker/backend.Dockerfile'
              - '.dockerignore'
              - 'docker-compose.dev.yml'
              - '.github/workflows/docker-publish-deploy-dev.yml'
            nar_agent:
              - 'nar_agent/**'
              - 'docker-compose.nar-agent.yml'
              - 'deploy/setup-nar-agent.py'
              - 'deploy/nar-agent-healthcheck.py'
              - 'deploy/nar-agent.env.example'
              - 'deploy/nar-execution.env.example'
              - '.github/workflows/nar-agent-build.yml'
              - '.github/workflows/docker-publish-deploy-dev.yml'
            frontend:
              - 'forge_frontend_next/**'
              - 'docker/frontend.Dockerfile'
              - '.dockerignore'
              - 'docker-compose.dev.yml'
              - '.github/workflows/docker-publish-deploy-dev.yml'

      - name: Select services
        id: selection
        shell: bash
        env:
          BACKEND_CHANGED: ${{ steps.paths.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.paths.outputs.frontend }}
          NAR_AGENT_CHANGED: ${{ steps.paths.outputs.nar_agent }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "nar_agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${BACKEND_CHANGED:-false}" >> "$GITHUB_OUTPUT"
            echo "frontend=${FRONTEND_CHANGED:-false}" >> "$GITHUB_OUTPUT"
            echo "nar_agent=${NAR_AGENT_CHANGED:-false}" >> "$GITHUB_OUTPUT"
          fi
          echo "version_tag=dev-sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  build-backend:
    environment: development
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push development backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/backend.Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ needs.detect-changes.outputs.version_tag }}
          cache-from: type=gha,scope=engine-skeleton-development-backend
          cache-to: type=gha,mode=max,scope=engine-skeleton-development-backend

  build-frontend:
    environment: development
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push development frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/frontend.Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            FORGE_BACKEND_URL=http://backend:8010
            NEXT_PUBLIC_BASE_PATH=/narrativeos
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.detect-changes.outputs.version_tag }}
          cache-from: type=gha,scope=engine-skeleton-development-frontend
          cache-to: type=gha,mode=max,scope=engine-skeleton-development-frontend

  build-nar-agent:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.nar_agent == 'true' }}
    uses: ./.github/workflows/nar-agent-build.yml
    with:
      version_tag: ${{ needs.detect-changes.outputs.version_tag }}
      publish_development: true
    secrets: inherit

  deploy:
    if: >-
      ${{
        always() &&
        (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/feature-')) &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) &&
        (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.nar_agent == 'true') &&
        (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
        (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') &&
        (needs.build-nar-agent.result == 'success' || needs.build-nar-agent.result == 'skipped')
      }}
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 240
    needs:
      - detect-changes
      - build-backend
      - build-frontend
      - build-nar-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare development deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            sudo install -d -o "$(id -un)" -g "$(id -gn)" "${{ secrets.DEPLOY_PATH }}"
      - name: Upload development deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.dev.yml,docker-compose.nar-agent.yml,deploy/setup-nar-agent.py,deploy/nar-agent-healthcheck.py,deploy/nar-agent.env.example,deploy/nar-execution.env.example"
          target: ${{ secrets.DEPLOY_PATH }}
      - name: Deploy on Non-Prod host
        uses: appleboy/ssh-action@v1.0.3
        env:
          VERSION_TAG: ${{ needs.detect-changes.outputs.version_tag }}
          DEPLOY_BACKEND: ${{ needs.detect-changes.outputs.backend }}
          DEPLOY_FRONTEND: ${{ needs.detect-changes.outputs.frontend }}
          DEPLOY_NAR_AGENT: ${{ needs.detect-changes.outputs.nar_agent }}
          REGISTRY: ${{ env.REGISTRY }}
          BACKEND_IMAGE_NAME: ${{ env.BACKEND_IMAGE_NAME }}
          FRONTEND_IMAGE_NAME: ${{ env.FRONTEND_IMAGE_NAME }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: VERSION_TAG,DEPLOY_BACKEND,DEPLOY_FRONTEND,DEPLOY_NAR_AGENT,REGISTRY,BACKEND_IMAGE_NAME,FRONTEND_IMAGE_NAME,ACR_USERNAME,ACR_PASSWORD
          command_timeout: 240m
          script: |
            set -e
            mkdir -p "${{ secrets.DEPLOY_PATH }}/deploy/sound-effects"
            cd "${{ secrets.DEPLOY_PATH }}"
            test -s .env || { echo "Missing development .env in $PWD"; exit 1; }
            echo "$ACR_PASSWORD" | docker login "$REGISTRY" -u "$ACR_USERNAME" --password-stdin
            IMAGE_STATE_FILE=".deploy-images.env"
            touch "$IMAGE_STATE_FILE"
            update_image_state() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" "$IMAGE_STATE_FILE"; then
                sed -i "s|^${key}=.*|${key}=${value}|" "$IMAGE_STATE_FILE"
              else
                printf '%s=%s\n' "$key" "$value" >> "$IMAGE_STATE_FILE"
              fi
            }
            if [ "$DEPLOY_BACKEND" = "true" ]; then
              update_image_state BACKEND_IMAGE "$REGISTRY/$BACKEND_IMAGE_NAME:$VERSION_TAG"
            fi
            if [ "$DEPLOY_FRONTEND" = "true" ]; then
              update_image_state FRONTEND_IMAGE "$REGISTRY/$FRONTEND_IMAGE_NAME:$VERSION_TAG"
            fi
            if ! grep -q '^BACKEND_IMAGE=' "$IMAGE_STATE_FILE" || ! grep -q '^FRONTEND_IMAGE=' "$IMAGE_STATE_FILE"; then
              echo "Both image entries must exist in $IMAGE_STATE_FILE. Run a full deployment once to initialize it."
              exit 1
            fi
            if [ "$DEPLOY_NAR_AGENT" = "true" ]; then
              update_image_state NAR_AGENT_IMAGE "$REGISTRY/acr_namespace_narrativeos/narrativeos-nar-agent:$VERSION_TAG"
              update_image_state NAR_EXECUTION_IMAGE "$REGISTRY/acr_namespace_narrativeos/narrativeos-nar-execution:$VERSION_TAG"
              update_image_state NAR_SANDBOX_IMAGE "$REGISTRY/acr_namespace_narrativeos/narrativeos-nar-sandbox:$VERSION_TAG"
            fi
            set -a
            . "./$IMAGE_STATE_FILE"
            set +a
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Neither 'docker compose' nor 'docker-compose' is installed on the remote host."
              exit 1
            fi
            docker network inspect narrativeos-development >/dev/null 2>&1 || docker network create narrativeos-development
            COMPOSE_FILES="-f docker-compose.dev.yml"
            NAR_ENABLED=false
            if [ -f .nar-agent-enabled ]; then
              test -s deploy/nar-agent.env && test -s deploy/nar-execution.env || { echo "Missing DEV Agent env files"; exit 1; }
              grep -Eq "^NAR_AGENT_DEPLOYMENT_ENV=['\"]?development['\"]?$" deploy/nar-agent.env || { echo "DEV Agent credentials must be configured with --environment development"; exit 1; }
              for image in "${NAR_AGENT_IMAGE:-}" "${NAR_EXECUTION_IMAGE:-}" "${NAR_SANDBOX_IMAGE:-}"; do
                case "$image" in *:dev-sha-*) ;; *) echo "Missing or non-development Agent image pin"; exit 1 ;; esac
              done
              COMPOSE_FILES="$COMPOSE_FILES -f docker-compose.nar-agent.yml"
              NAR_ENABLED=true
            fi
            SERVICES=""
            if [ "$DEPLOY_BACKEND" = "true" ]; then
              $COMPOSE_CMD --env-file .env $COMPOSE_FILES pull backend
              SERVICES="$SERVICES backend"
            fi
            if [ "$DEPLOY_FRONTEND" = "true" ]; then
              $COMPOSE_CMD --env-file .env $COMPOSE_FILES pull frontend
              SERVICES="$SERVICES frontend"
            fi
            if [ "$NAR_ENABLED" = "true" ] && [ "$DEPLOY_NAR_AGENT" = "true" ]; then
              docker pull "$NAR_SANDBOX_IMAGE"
              $COMPOSE_CMD --env-file .env $COMPOSE_FILES pull execution nar-agent
              $COMPOSE_CMD --env-file .env $COMPOSE_FILES up -d --no-deps execution
              $COMPOSE_CMD --env-file .env $COMPOSE_FILES up -d nar-agent
              # Apply internal URL/shared token even on the first Agent-only deploy.
              if [ "$DEPLOY_BACKEND" != "true" ]; then
                SERVICES="$SERVICES backend"
              fi
            fi
            if [ -n "$SERVICES" ]; then
              $COMPOSE_CMD --env-file .env $COMPOSE_FILES up -d --no-deps $SERVICES
            fi
            if [ "$NAR_ENABLED" = "true" ]; then
              for attempt in 1 2 3 4 5; do
                if $COMPOSE_CMD --env-file .env $COMPOSE_FILES exec -T backend python - < deploy/nar-agent-healthcheck.py; then
                  break
                fi
                if [ "$attempt" = "5" ]; then exit 1; fi
                sleep 5
              done
            elif [ "$DEPLOY_NAR_AGENT" = "true" ]; then
              echo "DEV Agent images/files prepared. In this DEV directory run: python3 deploy/setup-nar-agent.py --environment development --enable; then rerun a full development deployment."
            fi
