name: gesture-ar-integration
on:
  pull_request:
    paths:
      - 'gesture_sdk/**'
      - 'nar_agent/templates/gesture-cards/**'
      - 'nar_agent/tests/test_ar_template.py'
      - 'webgal_backend/work_publication.py'
      - 'forge_frontend_next/app/practice/works/**'
      - 'forge_frontend_next/next.config.mjs'
      - 'docker-compose.ar.*.yml'
      - '.github/workflows/gesture-ar.yml'
permissions:
  contents: read
jobs:
  isolated-player:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'fastapi>=0.115' 'httpx>=0.28' 'pytest>=9' 'uvicorn>=0.30'
      - run: python -m pytest -q tests/test_gesture_ar_origin.py
      - run: python -m compileall -q gesture_sdk nar_agent/app/template_catalog.py
  sdk-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gesture_sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: test -s dist/gesture-sdk/v1/hand-gesture-kit.esm.js
      - run: test -s dist/gesture-sdk/v1/wasm/vision_wasm_internal.wasm
      - run: test -s dist/gesture-sdk/v1/models/hand_landmarker.task
      - run: node --check dist/gesture-sdk/v1/nar-controls.esm.js
      - run: node --check dist/gesture-sdk/v1/hand-gesture-kit.esm.js
