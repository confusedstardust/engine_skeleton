name: nar-agent-html-integration
on:
  pull_request:
    paths:
      - 'nar_agent/**'
      - 'webgal_backend/nar_agent_routes.py'
      - 'webgal_backend/work_store.py'
      - 'webgal_backend/works_routes.py'
      - 'webgal_backend/work_publication.py'
      - 'webgal_backend/work_sharing.py'
      - 'tests/test_work_sharing.py'
      - 'tests/test_work_publication.py'
      - 'webgal_backend/app.py'
      - 'forge_frontend_next/app/history/**'
      - 'tests/test_works_routes.py'
      - 'forge_frontend_next/app/practice/**'
      - 'forge_frontend_next/components/ui/workspace-sidebar.*'
      - 'forge_frontend_next/components/account-menu.tsx'
      - 'forge_frontend_next/package.json'
      - 'forge_frontend_next/package-lock.json'
      - 'tests/practice_shared_navigation.test.cjs'
      - 'webgal_backend/work_urls.py'
      - 'tests/test_practice_public_page_route.cjs'
      - 'forge_frontend_next/next.config.mjs'
      - 'forge_frontend_next/middleware.ts'
      - 'tests/test_nar_agent_gateway.py'
      - 'tests/test_practice_work_rewrites.cjs'
      - '.github/workflows/nar-agent-html-integration.yml'
permissions:
  contents: read
jobs:
  gateway:
    name: Authenticated Forge gateway contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'fastapi>=0.115' 'httpx>=0.28' 'pytest>=9' 'uvicorn>=0.30' 'qrcode>=8' 'Pillow>=10'
      - run: python -m pytest -q tests/test_nar_agent_gateway.py tests/test_works_routes.py tests/test_work_publication.py tests/test_work_sharing.py
  frontend:
    name: Practice UI TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forge_frontend_next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: forge_frontend_next/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit --incremental false
      - run: node ../tests/test_practice_work_rewrites.cjs
      - run: node ../tests/practice_shared_navigation.test.cjs
      - run: npm run build
        env:
          FORGE_BACKEND_URL: http://backend:8010
          NEXT_PUBLIC_BASE_PATH: /narrativeos
      - run: node ../tests/test_practice_public_page_route.cjs
        env:
          NEXT_PUBLIC_BASE_PATH: /narrativeos
          FORGE_BACKEND_URL: http://127.0.0.1:8010
