<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选项专属对话 · 工作台原型</title>
<style>
:root{--ink:#322e28;--muted:#8b8376;--line:#e6dccd;--accent:#96653e;--paper:#fffefa;--green:#53705a}*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:var(--ink);font:15px/1.65 'Microsoft YaHei',sans-serif}header{padding:22px 4vw;border-bottom:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:space-between}h1{font:600 24px Georgia,'SimSun',serif;margin:0}small,.muted{color:var(--muted)}main{max-width:1400px;margin:28px auto;padding:0 28px;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:24px}button,select,input,textarea{font:inherit;color:inherit}button,select{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:7px 12px}button{cursor:pointer}button:hover{background:#f2eade;border-color:#bc9b78}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:#795034}.card{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:22px;margin-bottom:18px}.branch{border-left:3px solid #ae7b50;background:#fffcf7}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.tag{font-size:12px;padding:3px 9px;border-radius:20px;color:var(--green);background:#edf0e8}h2{margin:0;font-size:16px}h3{margin:0;font-size:14px}.option{border:1px solid var(--line);border-radius:9px;background:white;margin:12px 0;overflow:hidden}.option-top{padding:14px;display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center}.letter{font:20px Georgia;color:#b08c65}input,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px;background:#fffefa}textarea{resize:vertical;min-height:68px}.response-toggle{border:0;border-top:1px solid #f0e9df;border-radius:0;width:100%;text-align:left;padding:10px 15px;color:var(--accent);background:#fcf9f3}.responses{padding:4px 16px 16px 50px}.line{border-left:2px solid #e5d6c1;padding:10px 0 10px 13px;display:grid;grid-template-columns:90px 1fr;gap:8px}.line .tools{grid-column:1/-1;display:flex;gap:6px}.tools button{font-size:12px;padding:2px 8px}.exit{display:flex;gap:10px;align-items:center;border-top:1px dashed var(--line);margin-top:12px;padding-top:12px;font-size:13px}.exit select{flex:1}.danger{color:#a44a3b}.empty{font-size:13px;color:var(--muted);padding:13px 0}.note{font-size:13px;color:var(--muted)}aside{position:sticky;top:18px;align-self:start}.tabs{display:flex;gap:6px}.tabs button.active{background:#eadecc}.screen{min-height:230px;border:1px solid var(--line);background:#f5f1e9;padding:20px;border-radius:9px}.screen .dialogue{background:#fffefa;border-radius:8px;padding:15px;margin-bottom:12px}.screen button{display:block;width:100%;margin-top:9px;text-align:left}.screen .destination{color:var(--green);font-weight:600}.screen .who{color:var(--accent);font-size:12px}.trail{font-size:12px;color:var(--muted);margin:12px 0}pre{font:12px/1.85 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:560px;overflow:auto;background:#f5f1e9;padding:16px;border-radius:8px}.hidden{display:none}.status{font-size:12px;color:var(--green)}@media(max-width:900px){main{grid-template-columns:1fr;padding:0 14px}.option-top{grid-template-columns:24px 1fr}.option-top>button{grid-column:2}.responses{padding-left:18px}header{gap:12px;flex-wrap:wrap}aside{position:static}}
</style>
<header><div><small>NARRATIVEOS / 场景工作台</small><h1>荒原家园的第一步</h1></div><div><span class="status" id="status">交互原型 · 仅保存到本机浏览器</span> <button id="reset">恢复示例</button></div></header>
<main><section><div class="bar"><div><small>场景 01</small><h2>从「看」开始</h2></div><span class="tag">选项后先回应，再决定去向</span></div><div class="card">荒原家园的第一步，竟然要从“看”开始。</div><div id="editor"></div><div class="card"><div class="bar"><h2>公共正文</h2><span class="tag">留下的选项在这里汇合</span></div><p>荒原家园的模拟训练，从生活系统开始。</p><p class="note">选择“留在当前场景”的选项，会在专属对话结束后继续这里；选择其他场景则直接离开。</p></div><div class="card"><small>后续场景连接</small><p>完成当前场景后 → 九大舱体的秘密</p></div></section>
<aside class="card"><div class="bar"><h2>体验分支</h2><div class="tabs"><button class="active" id="playTab">运行预览</button><button id="codeTab">生成脚本</button></div></div><p class="note">修改左侧内容后，重新选择选项即可体验。</p><div id="player"></div><pre id="code" class="hidden"></pre><p class="note">标签由固定 ID 生成，修改文字和排序不会改变标签。此页用于确认交互，尚未接入正式游戏。</p></aside></main>
<script>
const key='narrativeos-choice-response-prototype-v1';
const sample=()=>[{id:'opt_observe',text:'先观察生活舱的水和空气循环',to:'continue',open:true,lines:[{id:'ln_water',speaker:'我',text:'先弄清楚水和空气从哪里来，才能安心住下来。'},{id:'ln_reply',speaker:'阿曜',text:'没错，我们从生活系统开始。'}]},{id:'opt_ask',text:'先找阿曜问清楚戈壁试车',to:'Cabins.txt',open:false,lines:[{id:'ln_ask',speaker:'我',text:'阿曜，试车之前还要检查什么？'},{id:'ln_answer',speaker:'阿曜',text:'先去动力舱看看，我带你过去。'}]}];
let options;try{options=JSON.parse(localStorage.getItem(key))||sample()}catch{options=sample()}let selected=null,step=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+crypto.randomUUID().replaceAll('-','');
function persist(){try{localStorage.setItem(key,JSON.stringify(options));document.querySelector('#status').textContent='已保存到本机浏览器 · 交互原型'}catch{document.querySelector('#status').textContent='交互原型 · 当前浏览器无法保存'}renderCode()}
function render(){document.querySelector('#editor').innerHTML=`<div class="card branch"><div class="bar"><h2>互动分支 <small> / ${options.length} 个选项</small></h2><button data-action="add-option">＋ 添加选项</button></div><p class="note">每个选项都可以拥有专属对话，并独立选择结束后的去向。</p>${options.map((o,i)=>`<article class="option" data-option="${o.id}"><div class="option-top"><span class="letter">${String.fromCharCode(65+i)}</span><input aria-label="选项文字" data-field="text" value="${esc(o.text)}"><button data-action="remove-option" class="danger" ${options.length<=2?'disabled':''}>删除</button></div><button class="response-toggle" data-action="toggle">${o.open?'▾':'▸'} 专属对话 · ${o.lines.length} 句 <small>${o.lines.length?'选择此项后播放':'未添加，选择后直接执行去向'}</small></button>${o.open?`<div class="responses">${o.lines.length?o.lines.map((l,j)=>`<div class="line" data-line="${l.id}"><input aria-label="说话人，旁白请填旁白" data-field="speaker" value="${esc(l.speaker)}"><textarea aria-label="对话内容" data-field="line-text">${esc(l.text)}</textarea><div class="tools"><button data-action="up" ${j===0?'disabled':''}>上移</button><button data-action="down" ${j===o.lines.length-1?'disabled':''}>下移</button><button data-action="remove-line" class="danger">删除此句</button></div></div>`).join(''):'<div class="empty">为这个选择写一句回应，让玩家看见自己的选择产生了什么。</div>'}<button data-action="add-line">＋ 对白</button> <button data-action="add-narration">＋ 旁白</button></div>`:''}<div class="responses"><div class="exit"><span>对话结束后</span><select aria-label="对话结束后的去向" data-field="to"><option value="continue" ${o.to==='continue'?'selected':''}>留在当前场景 · 继续公共正文</option><option value="Cabins.txt" ${o.to==='Cabins.txt'?'selected':''}>进入场景 · 九大舱体的秘密</option><option value="Home.txt" ${o.to==='Home.txt'?'selected':''}>进入场景 · 家园</option></select></div></div></article>`).join('')}</div>`;renderCode()}
function clean(s){return String(s).replace(/[;\r\n]/g,' ').trim()}
function compile(){const out=['旁白:荒原家园的第一步，竟然要从“看”开始。;','choose:'+options.map(o=>clean(o.text).replaceAll('|','｜').replaceAll(':','：')+':'+o.id+'_entry').join('|')+';'];for(const o of options){out.push('','label:'+o.id+'_entry;');for(const l of o.lines)out.push(clean(l.speaker||'旁白').replaceAll(':','：')+':'+clean(l.text)+';');out.push(o.to==='continue'?'jumpLabel:choice_intro_merge;':'changeScene:'+o.to+';')}if(options.some(o=>o.to==='continue'))out.push('','label:choice_intro_merge;','旁白:荒原家园的模拟训练，从生活系统开始。;','changeScene:Cabins.txt;');return out.join('\n')}
function renderCode(){document.querySelector('#code').textContent=compile()}
document.querySelector('#editor').addEventListener('input',e=>{const a=e.target.closest('[data-option]');if(!a)return;const o=options.find(o=>o.id===a.dataset.option),l=o.lines.find(l=>l.id===e.target.closest('[data-line]')?.dataset.line),f=e.target.dataset.field;if(f==='text'||f==='to')o[f]=e.target.value;if(f==='speaker')l.speaker=e.target.value;if(f==='line-text')l.text=e.target.value;persist()});
document.querySelector('#editor').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,o=options.find(o=>o.id===b.closest('[data-option]')?.dataset.option),li=o?.lines.findIndex(l=>l.id===b.closest('[data-line]')?.dataset.line);if(a==='add-option')options.push({id:uid('opt'),text:'新的选择',to:'continue',open:true,lines:[]});if(a==='remove-option')options=options.filter(x=>x!==o);if(a==='toggle')o.open=!o.open;if(a==='add-line'||a==='add-narration'){o.open=true;o.lines.push({id:uid('ln'),speaker:a==='add-narration'?'旁白':'我',text:''})}if(a==='remove-line')o.lines.splice(li,1);if(a==='up'&&li>0)[o.lines[li-1],o.lines[li]]=[o.lines[li],o.lines[li-1]];if(a==='down'&&li<o.lines.length-1)[o.lines[li+1],o.lines[li]]=[o.lines[li],o.lines[li+1]];persist();render()});
function player(){const box=document.querySelector('#player');if(!selected){box.innerHTML='<div class="screen"><small>当前场景 / 从「看」开始</small><p>荒原家园的第一步，竟然要从“看”开始。</p>'+options.map(o=>`<button data-pick="${o.id}">${esc(o.text||'（未填写选项）')}</button>`).join('')+'</div>';return}const o=selected;if(step<o.lines.length){const l=o.lines[step];box.innerHTML=`<div class="trail">已选择：${esc(o.text)} → 专属对话 ${step+1}/${o.lines.length}</div><div class="screen"><div class="dialogue"><div class="who">${esc(l.speaker||'旁白')}</div><p>${esc(l.text||'（空白对话）')}</p></div><button class="primary" data-next>继续 →</button></div>`}else box.innerHTML=`<div class="trail">已选择：${esc(o.text)} → 专属对话结束</div><div class="screen">${o.to==='continue'?'<span class="destination">↳ 留在当前场景 · 回到公共正文</span><p>荒原家园的模拟训练，从生活系统开始。</p><small>当前场景后续结束后，进入「九大舱体的秘密」。</small>':`<span class="destination">→ 进入「${o.to==='Cabins.txt'?'九大舱体的秘密':'家园'}」</span><p>这里开始播放目标场景的正文。</p><small>当前场景后面的公共正文不会执行。</small>`}<button data-restart>重新选择</button></div>`}
document.querySelector('#player').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.pick){selected=structuredClone(options.find(o=>o.id===b.dataset.pick));step=0}if(b.hasAttribute('data-next'))step++;if(b.hasAttribute('data-restart'))selected=null;player()});
for(const [id,code]of [['playTab',false],['codeTab',true]])document.getElementById(id).onclick=()=>{document.querySelector('#code').classList.toggle('hidden',!code);document.querySelector('#player').classList.toggle('hidden',code);document.querySelector('#playTab').classList.toggle('active',!code);document.querySelector('#codeTab').classList.toggle('active',code);if(!code){selected=null;player()}};
document.querySelector('#reset').onclick=()=>{options=sample();selected=null;persist();render();player()};render();player();
</script></html>
