# Optional Scheme A player overlay. Run alongside docker-compose.prod.yml.
# Reverse proxy HTTPS ar.narrativeos.cn -> 127.0.0.1:8040 (explicit host deployment step).
services:
  ar-player:
    build:
      context: .
      dockerfile: gesture_sdk/Dockerfile
    image: narrativeos-ar-player:feature-ar
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    volumes:
      - forge_jobs:/data/jobs:ro
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 384m
    cpus: "0.5"
    ports:
      - "127.0.0.1:8040:8040"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8040/health',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
