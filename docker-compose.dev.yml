services:
  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WEBGAL_BACKEND_ROOT: /app
      WEBGAL_JOBS_DIR: /data/jobs
      WEBGAL_FRONTEND_URL: ${WEBGAL_FRONTEND_URL:?set WEBGAL_FRONTEND_URL}
      WEBGAL_AUTH_MODE: ${WEBGAL_AUTH_MODE:-sso}
      WEBGAL_SSO_USERINFO_URL: ${WEBGAL_SSO_USERINFO_URL:-http://website:3000/api/auth/me}
      WEBGAL_SSO_COOKIE_NAME: ${WEBGAL_SSO_COOKIE_NAME:-nos_session}
      TEACHER_ECOSYSTEM_API_URL: ${TEACHER_ECOSYSTEM_API_URL:-http://website:3000/api/teacher-ecosystem/internal/works}
      TEACHER_ECOSYSTEM_SERVICE_TOKEN: ${TEACHER_ECOSYSTEM_SERVICE_TOKEN:-}
      WEBGAL_SOUND_EFFECTS_DIR: ${WEBGAL_SOUND_EFFECTS_DIR:-/opt/forge/sound-effects}
      WEBGAL_INVITE_CODES_FILE: /data/jobs/invite-codes.txt
      WEBGAL_IMAGE_BASE_URL: ${WEBGAL_IMAGE_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      WEBGAL_IMAGE_MODEL: ${WEBGAL_IMAGE_MODEL:-doubao-seedream-4-5-251128}
      WEBGAL_IMAGE_API_KEY_ENV: ${WEBGAL_IMAGE_API_KEY_ENV:-ARK_API_KEY}
    volumes:
      - forge_dev_jobs:/data/jobs
      - ${WEBGAL_SOUND_EFFECTS_DIR_HOST:-./deploy/sound-effects}:/opt/forge/sound-effects:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8010}:8010"
    networks:
      - narrativeos_development

  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      FORGE_BACKEND_URL: http://backend:8010
      HOSTNAME: 0.0.0.0
      PORT: 3001
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    networks:
      - narrativeos_development

volumes:
  forge_dev_jobs:

networks:
  narrativeos_development:
    external: true
    name: narrativeos-development
