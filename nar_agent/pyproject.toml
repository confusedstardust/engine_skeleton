[project]
name = "nar-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.32",
    "fastapi>=0.162.0",
    "langchain-openai>=1.7.3",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "docker==7.1.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
