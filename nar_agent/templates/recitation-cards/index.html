<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__NAR_TEMPLATE_TITLE__</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#303c30;background:#f3f4ed}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,720px)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:clamp(24px,4vw,36px);margin:0;line-height:1.3}#progress{color:#778472;font-size:13px}
.card{border:1px solid #d9e1d3;background:#fffefa;min-height:280px;border-radius:24px;padding:clamp(24px,5vw,42px);box-shadow:0 16px 40px #3b4c2610;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.label{font-size:12px;letter-spacing:.1em;color:#738469}#question{font-size:clamp(22px,4vw,31px);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;margin:24px 0}
#answer{font-size:clamp(17px,3vw,23px);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;color:#365d47;border-top:1px solid #e4e9dc;padding-top:18px;width:100%}
[hidden]{display:none!important}.actions{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
button{flex:1;min-width:120px;cursor:pointer;border-radius:12px;border:1px solid #9bac91;padding:14px 18px;color:#355342;background:white;font:inherit;font-size:15px}
button.primary{background:#476f51;border-color:#476f51;color:white}button:focus-visible{outline:3px solid #e4ab4a;outline-offset:3px}
.notice{color:#64755d;text-align:center;font-size:13px;line-height:1.8}
@media(max-width:450px){body{padding:12px}.card{min-height:250px}.top{flex-direction:column;align-items:flex-start}.actions button{min-width:0}}
</style>
</head>
<body><main>
<header class="top"><h1 id="title"></h1><span id="progress" aria-live="polite"></span></header>
<section class="card" aria-label="复习题卡"><span class="label">想一想，再揭晓答案</span><p id="question"></p><p id="answer" hidden></p></section>
<nav class="actions" aria-label="题卡操作"><button id="reveal" type="button" class="primary">查看答案</button><button id="next" type="button">下一题</button><button id="restart" type="button">重新开始</button></nav>
<p class="notice">先独立思考，再点击查看答案；学习进度保存在当前页面。</p>
<script type="application/json" id="nar-data">__NAR_TEMPLATE_DATA__</script>
<script>
(()=>{'use strict';const data=JSON.parse(document.getElementById('nar-data').textContent);
const $=id=>document.getElementById(id);let index=0,shown=false;
$('title').textContent=data.title;
function render(){const item=data.cards[index];$('question').textContent=item.question;$('answer').textContent=item.answer;
$('answer').hidden=!shown;$('reveal').textContent=shown?'收起答案':'查看答案';
$('progress').textContent=(index+1)+' / '+data.cards.length;}
$('reveal').addEventListener('click',()=>{shown=!shown;render();});
$('next').addEventListener('click',()=>{index=(index+1)%data.cards.length;shown=false;render();});
$('restart').addEventListener('click',()=>{index=0;shown=false;render();});
render();})();
</script></main></body></html>
